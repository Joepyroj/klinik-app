<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Staf - Klinik Sehat</title>
    <link
      href="{{ url_for('static', filename='css/bootstrap.min.css') }}"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap");
      body {
        font-family: "Poppins", sans-serif;
        background-color: #eef2f9;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .login-card {
        max-width: 450px;
        width: 100%;
        border-radius: 20px;
        border: none;
        background-color: #ffffff;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        position: relative;
        overflow: hidden;
      }
      .login-card::before {
        content: "";
        position: absolute;
        top: -80px;
        left: -100px;
        width: 250px;
        height: 250px;
        background: radial-gradient(#a8c0ff, #3f2b96);
        opacity: 0.15;
        border-radius: 50%;
        filter: blur(20px);
      }
      .card-header-custom {
        background: linear-gradient(135deg, #3f2b96 0%, #a8c0ff 100%);
        color: white;
        padding: 1.5rem;
        border-radius: 20px 20px 0 0;
        text-align: center;
        border-bottom: none;
      }
      .card-header-custom h3 {
        font-family: "Playfair Display", serif;
        font-size: 2rem;
        margin: 0;
      }
      .form-label {
        font-weight: 500;
        color: #555;
      }
      .form-control {
        border-radius: 10px;
        border: 1px solid #ddd;
        padding: 0.75rem 1rem;
      }
      .form-control:focus {
        border-color: #3f2b96;
        box-shadow: 0 0 0 0.25rem rgba(63, 43, 150, 0.2);
      }
      .btn-primary {
        background-color: #3f2b96;
        border-color: #3f2b96;
        border-radius: 10px;
        padding: 0.75rem;
        font-weight: 600;
        transition: all 0.3s ease;
      }
      .btn-primary:hover {
        background-color: #2c1d6a;
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(63, 43, 150, 0.3);
      }
      .back-link {
        display: inline-block;
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: #6c757d;
        text-decoration: none;
        transition: color 0.2s;
      }
      .back-link:hover {
        color: #3f2b96;
        text-decoration: underline;
      }
      /* Style untuk animasi fade out */
      .alert.fade-out {
        opacity: 0;
        transition: opacity 0.5s ease-out;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="card login-card">
        <div class="card-header-custom">
          <h3>Staf Login</h3>
        </div>
        <div class="card-body p-4 p-lg-5">
          <div id="flash-message-container">
            {% with messages = get_flashed_messages(with_categories=true) %} {%
            if messages %} {% for category, message in messages %}
            <div class="alert alert-{{ category }} small">{{ message }}</div>
            {% endfor %} {% endif %} {% endwith %}
          </div>

          <form method="POST">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input
                type="text"
                id="username"
                name="username"
                class="form-control"
                required
              />
            </div>
            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                required
              />
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">
                Login
              </button>
            </div>
          </form>

          <div class="text-center">
            <a href="{{ url_for('index') }}" class="back-link">
              <i class="fas fa-arrow-left me-1"></i> Halaman Utama
            </a>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const alert = document.querySelector("#flash-message-container .alert");
        if (alert) {
          // Tunggu 2 detik (2000 milidetik)
          setTimeout(() => {
            // Tambahkan class untuk memulai animasi fade out
            alert.classList.add("fade-out");

            // Hapus elemen dari DOM setelah animasi selesai
            setTimeout(() => {
              alert.remove();
            }, 500); // 500ms cocok dengan durasi transisi di CSS
          }, 2000);
        }
      });
    </script>
  </body>
</html>
