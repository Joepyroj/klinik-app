{# templates/admin/_receptionist_sidebar.html #}

<div class="card shadow-sm">
  <div class="card-header card-header-custom">
    <i class="fas fa-bars me-2"></i>Navigasi
  </div>
  <div class="list-group list-group-flush" id="receptionist-sidebar-nav">
    <a
      href="{{ url_for('receptionist.index') }}"
      class="list-group-item list-group-item-action active"
    >
      <i class="fas fa-clipboard-list fa-fw me-2"></i>Janji Temu Hari Ini
    </a>
    <a href="#" class="list-group-item list-group-item-action">
      <i class="fas fa-qrcode fa-fw me-2"></i>Scan QR Check-in
    </a>
    <a
      href="{{ url_for('receptionist_patients.index') }}"
      class="list-group-item list-group-item-action dynamic-loader"
    >
      <i class="fas fa-users fa-fw me-2"></i>Pasien
    </a>
    <a
      href="{{ url_for('receptionist_schedule.index') }}"
      class="list-group-item list-group-item-action dynamic-loader"
    >
      <i class="fas fa-calendar-check fa-fw me-2"></i>Lihat Jadwal Slot
    </a>
    <a
      href="{{ url_for('schedule_tool.index') }}"
      class="list-group-item list-group-item-action dynamic-loader"
    >
      <i class="fas fa-tools fa-fw me-2"></i>Alat Pengelola Jadwal
    </a>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const navContainer = document.getElementById("receptionist-sidebar-nav");
    const contentArea = document.getElementById("receptionist-content-area");

    // Bagian untuk memuat panel konten (Pasien, Jadwal, dll.)
    navContainer.addEventListener("click", function (e) {
      const link = e.target.closest("a.dynamic-loader");
      if (link) {
        e.preventDefault();
        navContainer
          .querySelectorAll("a")
          .forEach((a) => a.classList.remove("active"));
        link.classList.add("active");
        const url = link.getAttribute("href");
        contentArea.innerHTML =
          '<div class="d-flex justify-content-center p-5"><div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div></div>';
        fetch(url)
          .then((response) => response.text())
          .then((html) => {
            contentArea.innerHTML = html;
          })
          .catch((error) => {
            console.error("Error loading content:", error);
            contentArea.innerHTML =
              '<p class="text-danger">Gagal memuat konten.</p>';
          });
      }
    });

    // Bagian untuk menangani klik tombol tanggal di dalam panel
    contentArea.addEventListener("click", async function (e) {
      if (e.target.classList.contains("date-btn")) {
        const dateButton = e.target;
        contentArea
          .querySelectorAll(".date-btn")
          .forEach((btn) => btn.classList.remove("active"));
        dateButton.classList.add("active");
        const selectedDate = dateButton.dataset.date;
        const slotSection = contentArea.querySelector("#slot-section");
        const slotDisplay = contentArea.querySelector("#slot-display");
        if (!slotSection || !slotDisplay) return;

        slotSection.style.display = "block";
        slotDisplay.innerHTML =
          '<div class="spinner-border spinner-border-sm" role="status"><span class="visually-hidden">Loading...</span></div>';
        try {
          const response = await fetch(
            `/api/slots-by-date?date=${selectedDate}`
          );
          if (!response.ok) throw new Error("Gagal mengambil data slot");
          const slots = await response.json();
          slotDisplay.innerHTML = "";
          if (slots.length > 0) {
            slots.forEach((slot) => {
              const slotDiv = document.createElement("div");
              slotDiv.className = "slot-item";
              slotDiv.classList.add(
                slot.is_booked ? "slot-booked" : "slot-available"
              );
              let slotContent = slot.time;
              if (slot.is_booked && slot.patient_name) {
                slotContent += ` - ${slot.patient_name}`;
              }
              slotDiv.textContent = slotContent;
              slotDisplay.appendChild(slotDiv);
            });
          } else {
            slotDisplay.innerHTML =
              '<p class="text-muted">Tidak ada jam yang terjadwal untuk tanggal ini.</p>';
          }
        } catch (error) {
          console.error("Error:", error);
          slotDisplay.innerHTML =
            '<p class="text-danger">Terjadi kesalahan saat memuat jadwal.</p>';
        }
      }
    });

    // Delegated submit handling for Schedule Tool forms loaded dynamically
    contentArea.addEventListener('submit', async function (e) {
      const form = e.target.closest('form');
      if (!form) return;

      const action = form.getAttribute('action') || '';
      const isGenerate = form.id === 'generate-slots-form' || action.endsWith('/admin/scheduler/generate');
      const isShift = form.id === 'shift-time-form' || action.endsWith('/admin/scheduler/shift-time');
      const isReschedule = form.id === 'reschedule-day-form' || action.endsWith('/admin/scheduler/reschedule-day');

      if (!(isGenerate || isShift || isReschedule)) return; // let others pass

      e.preventDefault();

      // Locate alert boxes and buttons by context
      let alertBox, submitBtn;
      if (isGenerate) {
        alertBox = contentArea.querySelector('#schedule-tool-alert');
        submitBtn = contentArea.querySelector('#generate-submit-btn');
      } else if (isShift) {
        alertBox = contentArea.querySelector('#shift-alert');
        submitBtn = contentArea.querySelector('#shift-submit-btn');
      } else if (isReschedule) {
        alertBox = contentArea.querySelector('#reschedule-alert');
        submitBtn = contentArea.querySelector('#reschedule-submit-btn');
      }

      const showAlert = (message, type = 'success') => {
        if (!alertBox) return;
        alertBox.className = 'alert';
        alertBox.classList.add(type === 'success' ? 'alert-success' : 'alert-danger');
        alertBox.textContent = message;
        alertBox.classList.remove('d-none');
        setTimeout(() => { alertBox.classList.add('d-none'); }, 5000);
      };

      const original = submitBtn ? submitBtn.innerHTML : '';
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Processing...';
      }

      try {
        const response = await fetch(action, { method: 'POST', body: new FormData(form) });
        const result = await response.json().catch(() => ({ success: false, message: 'Format respons tidak valid' }));
        if (response.ok && result.success) {
          showAlert(result.message || 'Berhasil.', 'success');
          form.reset();
        } else {
          showAlert(result.message || 'Aksi gagal.', 'danger');
        }
      } catch (err) {
        console.error(err);
        showAlert('Kesalahan jaringan.', 'danger');
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = original;
        }
      }
    });
  });
</script>
