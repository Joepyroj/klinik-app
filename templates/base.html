<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{% block title %}Manajemen Praktik Pribadi{% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link
      href="{{ url_for('static', filename='css/custom.css') }}"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav
      class="navbar navbar-expand-lg navbar-light shadow-sm navbar-patient-custom"
    >
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
          <i class="fas fa-clinic-medical text-primary"></i>
          Praktek dr. Nama Dokter
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            {% if 'user' in session %}

            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </li>
            {% else %}
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('login') }}">Login Pasien</a>
            </li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>

    <main class="py-4">{% block content %}{% endblock %}</main>
    <footer class="clinic-footer mt-auto py-3">
      <div class="container text-center">
        <small>
          <i class="fas fa-map-marker-alt me-1"></i>
          <strong>Lokasi Praktek:</strong> Jl. Pahlawan No. 123, Sidoarjo
          <a
            href="https://maps.google.com/?q=Jl.+Pahlawan+No.+123,+Sidoarjo"
            target="_blank"
            class="ms-2 footer-map-link"
          >
            (Lihat Peta)
          </a>
        </small>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
